<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component Practice</title>
    <link rel="stylesheet" href="baiTH.css">
</head>
<body>
    <div class="card">
        <div class="card-image">
            <img src="https://th.bing.com/th/id/R.e5f2f5442689e73ae9434d1e82d0fcab?rik=AvIFUz7SHAFkug&pid=ImgRaw&r=0" alt="Raiden Shogun">
            <span class="card-type">Hệ Lôi</span>
        </div>
        <div class="card-content">
            <h3 class="card-title">Raiden Shogun</h3>
            <p class="card-description">Nhất Tâm Tịnh Thổ</p>
            <div class="card-stats">
                <div class="stat"><b>Cán dài</b><span>Vũ Khí</span></div>
                <div class="stat"><b>DPS</b><span>Vai Trò</span></div>
            </div>
            <button class="card-btn">Xem thêm</button>
        </div>
    </div>
</body>
</html>
